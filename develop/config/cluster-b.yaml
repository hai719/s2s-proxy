persistence:
  defaultStore: cass-default
  visibilityStore: es-visibility
  numHistoryShards: 3
  datastores:
    cass-default:
      cassandra:
        hosts: "127.0.0.1"
        keyspace: "temporal_cluster_b"
    es-visibility:
      elasticsearch:
        version: "v7"
        logLevel: "error"
        url:
          scheme: "http"
          host: "127.0.0.1:9200"
        indices:
          visibility: temporal_visibility_v1_dev_cluster_b
          # secondary_visibility: temporal_visibility_v2_dev
        closeIdleConnectionsInterval: 15s

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: "127.0.0.1"
  pprof:
    port: 8936
  metrics:
    prometheus:
#      # specify framework to use new approach for initializing metrics and/or use opentelemetry
#      framework: "opentelemetry"
      framework: "tally"
      timerType: "histogram"
      listenAddress: "127.0.0.1:8001"

services:
  frontend:
    rpc:
      grpcPort: 8233
      membershipPort: 8933
      bindOnLocalHost: true
      httpPort: 8243

  matching:
    rpc:
      grpcPort: 8235
      membershipPort: 8935
      bindOnLocalHost: true

  history:
    rpc:
      grpcPort: 8234
      membershipPort: 8934
      bindOnLocalHost: true

  worker:
    rpc:
      grpcPort: 8239
      membershipPort: 8939
      bindOnLocalHost: true

clusterMetadata:
  enableGlobalNamespace: true
  failoverVersionIncrement: 1000000
  masterClusterName: "cluster-b"
  currentClusterName: "cluster-b"
  clusterInformation:
    cluster-b:
      enabled: true
      initialFailoverVersion: 10 
      rpcName: "frontend"
      rpcAddress: "localhost:8233"

dcRedirectionPolicy:
  policy: "all-apis-forwarding"

archival:
  history:
    state: "enabled"
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"
      gstorage:
        credentialsPath: "/tmp/gcloud/keyfile.json"
  visibility:
    state: "enabled"
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"

namespaceDefaults:
  archival:
    history:
      state: "disabled"
      URI: "file:///tmp/temporal_archival/development"
    visibility:
      state: "disabled"
      URI: "file:///tmp/temporal_vis_archival/development"

dynamicConfigClient:
  filepath: "develop/config/dynamic-config.yaml"
  pollInterval: "10s"

